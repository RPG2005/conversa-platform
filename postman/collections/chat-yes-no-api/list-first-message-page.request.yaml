$kind: http-request
description: |-
  Obtiene la primera página y guarda `message_cursor`. Ejecutar después de los mensajes de Ada y Bob, antes de List next message page.
method: GET
url: '{{base_url}}/conversations/{{conversation_id}}/messages?limit=1'
order: 16000
queryParams:
  - key: limit
    value: '1'
headers:
  - key: Cookie
    value: 'chat_session={{eve_session}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Eve can read messages after becoming a member', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.messages).to.have.length(1);
      pm.expect(body.nextCursor).to.be.a('string');
      pm.environment.set('next_cursor', body.nextCursor);
      const message = body.messages[0];
      const syncCursor = Buffer.from(JSON.stringify({ createdAt: message.createdAt, id: message.id })).toString('base64url');
      pm.environment.set('sync_cursor', syncCursor);
