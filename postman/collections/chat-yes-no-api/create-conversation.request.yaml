$kind: http-request
method: POST
url: '{{base_url}}/conversations'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'chat_session={{ada_session}}'
body:
  type: json
  content: |-
    {
      "participantEmail": "bob+{{run_id}}@example.test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('private conversation is created', () => pm.response.to.have.status(201));
      pm.environment.set('conversation_id', pm.response.json().conversation.id);
