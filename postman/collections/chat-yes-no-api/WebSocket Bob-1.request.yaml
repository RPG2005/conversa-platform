$kind: websocket-request
name: WebSocket Bob
description: |-
  Conecta a Bob autorizado; recibe eventos de Ada. Abrir antes de Send Ada message para comprobar `message.created` y `typing.changed`.
url: ws://localhost:3000/ws/conversations/{{conversation_id}}
headers:
  Cookie: chat_session={{bob_session}}
settings: {}
messages: .resources/WebSocket Bob-1.resources/messages
order: 20000
