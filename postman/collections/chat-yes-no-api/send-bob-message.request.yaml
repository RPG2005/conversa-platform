$kind: http-request
description: |-
  Crea un mensaje de texto de Bob. Ejecutar después del mensaje de Ada para preparar paginación y sincronización.
method: POST
url: '{{base_url}}/conversations/{{conversation_id}}/messages'
order: 15000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: 'chat_session={{bob_session}}'
body:
  type: json
  content: |-
    {
      "content": "Respuesta de Bob"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Bob message is persisted', () => pm.response.to.have.status(201));
