$kind: http-request
method: POST
url: "{{base_url}}/conversations/{{conversation_id}}/messages"
order: 11000
headers:
  Content-Type: application/json
  Cookie: chat_session={{ada_session}}
body:
  type: json
  content: '{"type":"text","content":"Hello, this is a test message."}'
scripts:
  - type: afterResponse
    code: pm.test('Ada message is persisted', () => pm.response.to.have.status(400));
    language: text/javascript
