$kind: http-request
description: |-
  Comprueba API, PostgreSQL y Redis. Ejecutar primero en todos los flujos; debe responder 200 con servicios `ok`.
method: GET
url: '{{base_url}}/health'
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test('healthcheck returns 200', () => pm.response.to.have.status(200));
      pm.test('database and redis are healthy', () => {
        const body = pm.response.json();
        pm.expect(body).to.deep.equal({ status: 'ok', services: { database: 'ok', redis: 'ok' } });
      });
