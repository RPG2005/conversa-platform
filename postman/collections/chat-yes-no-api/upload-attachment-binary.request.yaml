$kind: http-request
description: |-
  Sube el binario mediante URL firmada a SeaweedFS. Ejecutar después de Create attachment upload URL y antes de Complete attachment upload.
name: Upload attachment binary
method: PUT
url: '{{attachment_upload_url}}'
order: 10000
headers:
  - key: Content-Type
    value: application/pdf
body:
  type: file
  content:
    src: '{{attachment_file_path}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('SeaweedFS accepts the signed upload', () => pm.expect(pm.response.code).to.be.oneOf([200, 204]));
