$kind: http-request
description: |-
  Confirma que Eve no puede leer antes de ser miembro. Ejecutar después de Create conversation y antes de Add Eve; esperado 404.
method: GET
url: '{{base_url}}/conversations/{{conversation_id}}/messages?limit=1'
order: 7000
queryParams:
  - key: limit
    value: '1'
headers:
  - key: Cookie
    value: 'chat_session={{eve_session}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('non-member cannot discover the conversation', () => pm.response.to.have.status(404));
