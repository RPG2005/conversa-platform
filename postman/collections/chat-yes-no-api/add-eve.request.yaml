$kind: http-request
method: POST
url: "{{base_url}}/conversations/{{conversation_id}}/members"
order: 8000
headers:
  Content-Type: application/json
  Cookie: chat_session={{ada_session}}
body:
  type: json
  content: |-
    {
      "email": "eve+{{run_id}}@example.test"
    }
scripts:
  - type: afterResponse
    code: pm.test('member is added', () => pm.response.to.have.status(201));
