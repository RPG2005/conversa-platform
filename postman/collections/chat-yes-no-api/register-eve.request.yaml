$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "eve+{{run_id}}@example.test",
      "displayName": "Eve",
      "password": "{{test_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Eve is registered', () => pm.response.to.have.status(201));
      const match = pm.response.headers.get('Set-Cookie').match(/chat_session=([^;]+)/);
      pm.environment.set('eve_session', match[1]);
