name: conversa-platform

services:
  api:
    build:
      context: ./apps/api
    container_name: conversa-api
    restart: unless-stopped
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chat_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-conversa}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      API_SECRET: ${API_SECRET:?Set API_SECRET in .env}
      S3_INTERNAL_ENDPOINT: http://object-storage:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_BUCKET: ${S3_BUCKET:-chat-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat_network

  frontend:
    build:
      context: ./apps/frontend
    container_name: conversa-frontend
    restart: unless-stopped
    profiles: ["app"]
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    networks:
      - chat_network

  postgres:
    image: postgres:16-alpine
    container_name: conversa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conversa}
      POSTGRES_USER: ${POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - chat_network

  redis:
    image: redis:7-alpine
    container_name: conversa-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - chat_network

  object-storage:
    image: chrislusf/seaweedfs:latest
    container_name: conversa-object-storage
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-chat-media}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - object_storage_data:/data
    networks:
      - chat_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: conversa-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - chat_network

volumes:
  # Keep the previous volume IDs so the folder/project rename reuses local data.
  postgres_data:
    name: conversa-platform_postgres_data
    external: true
  redis_data:
    name: conversa-platform_redis_data
    external: true
  object_storage_data:
    name: conversa-platform_object_storage_data
    external: true
  frontend_node_modules:
    name: conversa-platform_frontend_node_modules
    external: true

networks:
  chat_network:
    driver: bridge
